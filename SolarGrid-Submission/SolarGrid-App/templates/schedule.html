{% extends 'base.html' %}{% block content %}<h1>Schedule installation</h1><section><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="site">Customer site</label><select id="site" name="site_id" required><option value="">Choose site</option>{% for r in sites %}<option value="{{ r.site_id }}">{{ r.customer_name }} · {{ r.site_name }}</option>{% endfor %}</select><label for="date">Scheduled time</label><input id="date" type="datetime-local" name="scheduled_at" required><label for="tech">Lead technician</label><select id="tech" name="technician_id" required><option value="">Choose technician</option>{% for r in technicians %}<option value="{{ r.technician_id }}">{{ r.full_name }}</option>{% endfor %}</select><label for="work">Work description</label><textarea id="work" name="work_description" maxlength="2000" required></textarea><p><button>Schedule and assign lead</button></p></form></section>{% endblock %}
