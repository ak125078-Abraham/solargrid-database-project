{% macro show(rows) %}{% if rows %}<div class="table-wrap"><table><thead><tr>{% for key in rows[0] %}<th>{{ key.replace('_',' ') }}</th>{% endfor %}</tr></thead><tbody>{% for row in rows %}<tr>{% for value in row.values() %}<td>{{ value if value is not none else '—' }}</td>{% endfor %}</tr>{% endfor %}</tbody></table></div>{% else %}<p>No records found.</p>{% endif %}{% endmacro %}
