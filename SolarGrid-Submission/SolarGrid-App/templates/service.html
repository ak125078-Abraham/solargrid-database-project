{% extends 'base.html' %}{% from '_table.html' import show %}{% block content %}<h1>Service requests</h1><section><h2>Register and assign request</h2><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="job">Completed installation</label><select id="job" name="installation_id" required>{% for r in jobs %}<option value="{{ r.installation_id }}">Installation {{ r.installation_id }}</option>{% endfor %}</select><label for="tech">Technician</label><select id="tech" name="technician_id" required>{% for r in technicians %}<option value="{{ r.technician_id }}">{{ r.full_name }}</option>{% endfor %}</select><label for="priority">Priority</label><select id="priority" name="priority">{% for p in ['MEDIUM','LOW','HIGH','URGENT'] %}<option>{{ p }}</option>{% endfor %}</select><label for="problem">Problem description</label><textarea id="problem" name="problem_description" maxlength="2000" required></textarea><p><button>Register request</button></p></form></section><section><h2>Open requests</h2>{{ show(rows) }}<p><a href="/maintenance">Record maintenance</a></p></section>{% endblock %}
