{% extends 'base.html' %}{% block content %}<h1>Record payment</h1><section>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="invoice_id">Invoice</label><select name="invoice_id" id="invoice_id" required><option value="">Select invoice</option>{% for r in invoices %}<option value="{{ r.invoice_id }}" {{ 'selected' if data.get('invoice_id')|string==r.invoice_id|string else '' }}>{{ r.invoice_number }} · {{ r.customer_name }} · ZMW {{ r.outstanding_balance }} outstanding</option>{% endfor %}</select><label for="receipt">Unique receipt number</label><input name="receipt" id="receipt" value="{{ data.get('receipt','') }}" maxlength="40" required><label for="amount">Amount (ZMW)</label><input name="amount" id="amount" type="number" min="0.01" max="9999999999.99" step="0.01" value="{{ data.get('amount','') }}" required><label for="method">Method</label><select name="method" id="method">{% for m in ['CASH','BANK_TRANSFER','MOBILE_MONEY','CARD'] %}<option {{ 'selected' if data.get('method')==m else '' }}>{{ m }}</option>{% endfor %}</select><p>Saving posts this payment to the selected invoice.</p><button>Save payment</button></form></section>{% endblock %}
