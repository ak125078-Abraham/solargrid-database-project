{% extends 'base.html' %}{% block content %}<h1>Assign technician</h1><section><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="job">Installation</label><select id="job" name="installation_id" required>{% for r in jobs %}<option value="{{ r.installation_id }}">Installation {{ r.installation_id }}</option>{% endfor %}</select><label for="tech">Technician</label><select id="tech" name="technician_id" required>{% for r in technicians %}<option value="{{ r.technician_id }}">{{ r.full_name }}</option>{% endfor %}</select><label for="role">Assignment role</label><select id="role" name="assignment_role"><option>ASSISTANT</option><option>LEAD</option></select><p><button>Assign technician</button></p></form></section>{% endblock %}
