{% extends 'base.html' %}{% from '_table.html' import show %}{% block content %}<h1>{{ title }}</h1><section><h2>Add record</h2><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">{% for name,label,kind,limit in fields %}<label for="{{ name }}">{{ label }}</label>{% if kind in ['customers','models','category'] %}<select id="{{ name }}" name="{{ name }}" required><option value="">Choose</option>{% if kind=='category' %}{% for c in ['PANEL','BATTERY','INVERTER','OTHER'] %}<option>{{ c }}</option>{% endfor %}{% else %}{% for r in choices[kind] %}<option value="{{ r.id }}">{{ r.label }}</option>{% endfor %}{% endif %}</select>{% else %}<input id="{{ name }}" name="{{ name }}" type="{{ 'number' if kind in ['money','integer'] else ('date' if kind=='date' else ('email' if kind=='email' else 'text')) }}" {% if limit %}maxlength="{{ limit }}"{% endif %} {% if kind in ['money','integer'] %}min="0" step="{{ '0.01' if kind=='money' else '1' }}"{% endif %} {% if kind=='date' %}value="{{ today }}" max="{{ today }}"{% endif %} {% if kind not in ['optional','email'] %}required{% endif %}>{% endif %}{% endfor %}<p><button>Save record</button></p></form></section><section><h2>Latest 100 records</h2>{{ show(rows) }}</section>{% endblock %}
