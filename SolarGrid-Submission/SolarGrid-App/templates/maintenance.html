{% extends 'base.html' %}{% block content %}<h1>Record maintenance</h1><section><p>Select the request and its assigned technician. The work time is recorded when you save.</p><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="request">Request</label><select id="request" name="service_request_id" required>{% for r in assignments|unique(attribute='service_request_id') %}<option value="{{ r.service_request_id }}">Request {{ r.service_request_id }}</option>{% endfor %}</select><label for="tech">Assigned technician</label><select id="tech" name="technician_id" required>{% for r in assignments %}<option value="{{ r.technician_id }}">Request {{ r.service_request_id }} · {{ r.full_name }}</option>{% endfor %}</select><label for="work">Work performed</label><textarea id="work" name="work_done" maxlength="2000" required></textarea><label for="cost">Cost (ZMW)</label><input id="cost" type="number" min="0" step="0.01" name="maintenance_cost" required><label for="next">Next service date (optional)</label><input id="next" type="date" name="next_service_date"><label><input type="checkbox" name="resolve" value="1"> Mark request resolved</label><p><button>Save maintenance</button></p></form></section>{% endblock %}
