<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarGrid</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><a class="brand" href="/">☀ SolarGrid</a>{% if g.user %}<form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><span>{{ g.user.username }} · {{ g.user.role }}</span> <button>Sign out</button></form>{% endif %}</header><main>{% if g.user %}{% include 'nav.html' %}{% endif %}{% for message in get_flashed_messages() %}<p role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
